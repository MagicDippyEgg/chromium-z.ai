  # ==========================================================================
  # 4. Package job — package the built browser into a downloadable tar.gz.
  # ==========================================================================
  package:
    name: Package the Halcyon browser
    needs: build_part_10
    # Run only if the build chain succeeded (don't run on cancellation
    # or failure — that would just produce confusing skip messages).
    if: ${{ !cancelled() && needs.build_part_10.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Halcyon overlay
        uses: actions/checkout@v4

      # The package job runs if ANY of the build_part jobs reported
      # status=completed (which means chrome was actually built).
      # We check each build_part's output; if any says "completed",
      # we proceed. Otherwise we fail with a clear message.
      - name: Check if any build_part produced the chrome binary
        id: check
        run: |
          # Check the status of all build_part jobs.
          # The chain is 10 jobs; if any exited with status=completed,
          # we have a chrome binary to package.
          STATUSES="${{ needs.build_part_01.outputs.status }} ${{ needs.build_part_02.outputs.status }} ${{ needs.build_part_03.outputs.status }} ${{ needs.build_part_04.outputs.status }} ${{ needs.build_part_05.outputs.status }} ${{ needs.build_part_06.outputs.status }} ${{ needs.build_part_07.outputs.status }} ${{ needs.build_part_08.outputs.status }} ${{ needs.build_part_09.outputs.status }} ${{ needs.build_part_10.outputs.status }}"
          echo "build_part statuses: $STATUSES"
          if echo "$STATUSES" | grep -q "completed"; then
            echo "ok: at least one build_part produced the chrome binary"
            echo "should_package=true" >> "$GITHUB_OUTPUT"
          else
            # No build_part finished — the build is incomplete.
            # Fail this job loudly so the workflow reports failure.
            echo "::error::no build_part produced the chrome binary; cannot package" >&2
            echo "  This usually means the 10 chunks (50 hours) were not enough" >&2
            echo "  to complete a clean build. The workflow needs more chunks," >&2
            echo "  OR a chunk failed mid-way. Check the build_part_NN job logs." >&2
            echo "should_package=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Free up runner disk
        if: steps.check.outputs.should_package == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check.outputs.should_package == 'true'


      - name: Pull Docker image
        if: steps.check.outputs.should_package == 'true'
        run: docker pull ${{ needs.prep.outputs.docker-tag }}

      - name: Download final build cache
        if: steps.check.outputs.should_package == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        if: steps.check.outputs.should_package == 'true'
        run: |
          bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"

      - name: Verify chrome binary exists
        if: steps.check.outputs.should_package == 'true'
        run: |
          CHROME="build/src/out/Halcyon/chrome"
          if [[ ! -x "$CHROME" ]]; then
            echo "::error::chrome binary not found at $CHROME" >&2
            echo "  the build cache was imported but the binary is missing" >&2
            exit 1
          fi
          ls -lh "$CHROME"
          file "$CHROME"

      - name: Package the browser
        if: steps.check.outputs.should_package == 'true'
        run: |
          # Use the existing package_halcyon.sh script. It knows what
          # runtime files to include (.so, .pak, .dat, locales/, etc.).
          bash scripts/package_halcyon.sh \
            "build/src/out/Halcyon" \
            "$GITHUB_WORKSPACE/halcyon-linux-x86_64" \
            "$GITHUB_WORKSPACE/halcyon-linux-x86_64.tar.gz"

      - name: Show package contents
        if: steps.check.outputs.should_package == 'true'
        run: |
          ls -la "$GITHUB_WORKSPACE/halcyon-linux-x86_64" | head -20
          echo ""
          echo "=== archive ==="
          ls -lh "$GITHUB_WORKSPACE/halcyon-linux-x86_64.tar.gz"

      - name: Upload browser artifact
        if: steps.check.outputs.should_package == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BROWSER_ARTIFACT }}
          path: halcyon-linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error
          compression-level: 0  # already a tar.gz

  # ==========================================================================
  # 5. Cleanup job — delete the intermediate build-cache artifacts.
  # ==========================================================================
  # The build-cache artifacts are 5-10 GB each. We have a 10 GB total
  # per-repo storage budget. We must delete them after the build to
  # free up space for future runs.
  cleanup:
    name: Clean up intermediate artifacts
    needs: package
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete intermediate build-cache artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const artifactName = process.env.CACHE_ARTIFACT;

            // List all artifacts in this run.
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId,
            });

            // Find the build-cache artifact(s) and delete them.
            for (const a of artifacts.data.artifacts) {
              if (a.name === artifactName) {
                console.log(`Deleting artifact ${a.name} (id=${a.id}, size=${a.size_in_bytes} bytes)`);
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: a.id,
                });
              }
            }
            console.log('Cleanup complete.');
        env:
          CACHE_ARTIFACT: ${{ env.CACHE_ARTIFACT }}