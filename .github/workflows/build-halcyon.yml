  build_part_10:
    name: Build (chunk 10/10, final)
    needs: build_part_09
    if: needs.build_part_09.outputs.status == 'running'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
