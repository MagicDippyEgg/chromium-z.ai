      - name: Run ninja (chunk 10, final)
        id: build
        run: |
          # _gha_final=true: this is the last chunk; it must succeed.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false -e _gha_final=true \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} -e HOME=/tmp \
