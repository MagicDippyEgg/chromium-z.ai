<?xml version="1.0" encoding="UTF-8"?>
<!--
  Halcyon icon sprite. Each icon is a nested <svg> with a `data-icon`
  attribute that names it.

  Usage in WebUI:
    <halcyon-icon name="lantern"></halcyon-icon>
  The <halcyon-icon> custom element in halcyon_icon.js fetches this sprite
  once, looks up the inner <svg> with the matching data-icon, and inlines
  it. (Inline copying means CSS can color and animate the strokes via
  `currentColor`.)

  Usage in native Views:
    HalcyonIconLoader::Load("lantern")
  The native loader reads this same file once and serves the inner SVG
  markup on demand, parsed into an SkPicture for drawing.

  All icons are on a 24x24 grid, 1.5px stroke, rounded caps. No fills
  (except the brand mark / Lantern indicator, which can be filled when
  "glowing"). Icons inherit color via `currentColor`.

  See halcyon/branding/iconography.md for the full catalog. This file
  contains the most-used ~30 icons. The remaining ~10 are documented in
  iconography.md and would be drawn as individual SVG files in this
  directory.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
  <!-- The outer <svg> is a container only; `style="display:none"` keeps it
       invisible if the sprite is ever referenced via <img> or <use> from a
       page. The inner <svg>s are the actual icons. -->

  <!-- Navigation -->
  <svg data-icon="chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"/></svg>
  <svg data-icon="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L15 12 L9 18"/></svg>
  <svg data-icon="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"/></svg>
  <svg data-icon="chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15 L12 9 L18 15"/></svg>
  <svg data-icon="arrow-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 0 1 12 4 A8 8 0 0 1 20 12"/><path d="M20 12 L20 6"/><path d="M20 12 L14 12"/><path d="M20 12 A8 8 0 0 1 12 20 A8 8 0 0 1 4 12"/><path d="M4 12 L4 18"/><path d="M4 12 L10 12"/></svg>
  <svg data-icon="arrow-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 L18 6 L18 18"/><path d="M18 6 L6 18"/><path d="M14 6 L18 6 L18 10"/></svg>

  <!-- Tabs & windows -->
  <svg data-icon="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 L12 18"/><path d="M6 12 L18 12"/></svg>
  <svg data-icon="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 L17 17"/><path d="M17 7 L7 17"/></svg>
  <svg data-icon="anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L12 7"/><path d="M9 7 L15 7"/><path d="M12 7 L12 17 A6 6 0 0 1 6 11"/><path d="M12 17 A6 6 0 0 1 18 11"/></svg>
  <svg data-icon="window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9 L20 9"/></svg>
  <svg data-icon="window-cove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M4 19 Q8 16 12 19 T20 19"/></svg>

  <!-- Page actions -->
  <svg data-icon="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L14.4 9 L20 10 L16 14 L17 20 L12 17 L7 20 L8 14 L4 10 L9.6 9 Z"/></svg>
  <svg data-icon="star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 4 L14.4 9 L20 10 L16 14 L17 20 L12 17 L7 20 L8 14 L4 10 L9.6 9 Z"/></svg>
  <svg data-icon="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L12 15"/><path d="M8 11 L12 15 L16 11"/><path d="M5 19 L19 19"/></svg>
  <svg data-icon="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11 L16 7"/><path d="M8 13 L16 17"/></svg>
  <svg data-icon="print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9 L7 4 L17 4 L17 9"/><path d="M5 9 L19 9 Q20 9 20 10 L20 16 Q20 17 19 17 L5 17 Q4 17 4 16 L4 10 Q4 9 5 9 Z"/><path d="M7 13 L17 13 L17 20 L7 20 Z"/></svg>
  <svg data-icon="find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 L19 19"/></svg>
  <svg data-icon="zoom-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M11 8 L11 14"/><path d="M8 11 L14 11"/><path d="M15.5 15.5 L19 19"/></svg>
  <svg data-icon="zoom-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M8 11 L14 11"/><path d="M15.5 15.5 L19 19"/></svg>
  <svg data-icon="plume-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15 15 Q17 12 19 15"/></svg>

  <!-- The Lantern (also the brand mark) -->
  <svg data-icon="lantern" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7 12 L17 12"/></svg>
  <svg data-icon="lantern-glow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7 12 L17 12"/></svg>

  <!-- Tidemarks -->
  <svg data-icon="tidemarks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8 L18 8"/><path d="M6 12 L14 12"/><path d="M6 16 L10 16"/></svg>

  <!-- Quiet Mode -->
  <svg data-icon="quiet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L19 12"/><path d="M16 8 L19 8 L19 11"/><path d="M16 16 L19 16 L19 13"/></svg>
  <svg data-icon="quiet-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L19 12"/></svg>

  <!-- Quill (notes) -->
  <svg data-icon="quill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 L19 5"/><path d="M5 19 L9 19 L19 9 L19 5"/></svg>

  <!-- Margin note -->
  <svg data-icon="margin-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 L8 19"/><path d="M8 5 L11 5"/><path d="M8 12 L11 12"/><path d="M8 19 L11 19"/></svg>

  <!-- The Cove -->
  <svg data-icon="cove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 L20 8"/><path d="M4 16 L20 16"/><path d="M5 12 Q9 9 12 12 T19 12"/></svg>

  <!-- Cairn (bookmarks) -->
  <svg data-icon="cairn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17 L19 17"/><path d="M8 13 L16 13"/><path d="M10 9 L14 9"/></svg>

  <!-- Tides (history) -->
  <svg data-icon="tides" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 Q8 5 12 8 T20 8"/><path d="M4 12 Q8 9 12 12 T20 12"/><path d="M4 16 Q8 13 12 16 T20 16"/></svg>

  <!-- Settings -->
  <svg data-icon="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L18 12"/><circle cx="9" cy="12" r="2.5"/></svg>
  <svg data-icon="settings-appearance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7 12 L17 12"/></svg>
  <svg data-icon="settings-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15 15 Q17 12 19 15"/></svg>
  <svg data-icon="settings-privacy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7 12 L17 12"/></svg>
  <svg data-icon="settings-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 L19 9"/><path d="M5 13 L19 13"/><path d="M5 17 L19 17"/></svg>

  <!-- Misc -->
  <svg data-icon="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12 L10 16 L18 8"/></svg>
  <svg data-icon="minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L19 12"/></svg>
  <svg data-icon="dot" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.5"/></svg>

  <!-- Halcyon brand mark -->
  <svg data-icon="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M6 12 L18 12"/></svg>
</svg>
