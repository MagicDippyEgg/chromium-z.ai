# Build the Halcyon Browser — chunked pipeline.
#
# This is the production build workflow. It produces a real, launchable
# Halcyon browser binary on free GitHub Actions infrastructure by
# chunking the multi-hour Chromium ninja build across N sequential jobs.
#
# The pattern is borrowed from ungoogled-chromium-portablelinux (which
# has 70+ successful runs on the same infrastructure). Each build_part
# job runs `timeout 18000s ninja -C out/Halcyon chrome` (5 hours); if
# ninja times out, the next job continues from the persisted state.
#
# Pipeline overview:
#
#   prep           (1 job, ~30 min)
#     - Build & push the Docker image to GHCR (if changed)
#     - Pull the Docker image
#     - Inside the container: fetch Chromium source, apply Halcyon
#       overlay + patches, write args.gn, run gn gen
#     - Export the build/ directory as a tar.zst artifact
#
#   build_part_NN  (10 jobs, sequential, ~5h each = 50h max)
#     - Pull the Docker image
#     - Download the previous job's build-cache artifact
#     - Inside the container: run `timeout 18000s ninja -C out/Halcyon chrome`
#     - If ninja finishes: write "status=completed" and exit 0
#     - If ninja times out: write "status=running" and exit 0
#     - Export the new build/ state as an artifact (overwrites the prev)
#
#   package        (1 job, ~10 min)
#     - Download the final build-cache artifact
#     - Inside the container: run scripts/package_halcyon.sh
#     - Upload the resulting halcyon-linux-x86_64.tar.gz as a 14-day
#       artifact
#
#   cleanup        (1 job, ~1 min)
#     - Delete the intermediate build-cache artifacts (they're 5-10 GB
#       each and we have a 10 GB total per-repo storage budget)
#     - Always runs, even if package failed
#
# Total wall-clock for a clean build: ~15-20 hours, all on free
# ubuntu-22.04 runners. Subsequent incremental builds are much faster
# (only the changed ninja targets need rebuilding).
#
# Runner resources (verified):
#   ubuntu-22.04: 4 cores, 16 GB RAM, ~14 GB free SSD
#   Job timeout: 6 hours (we use 5h per build_part for safety)
#   Cache: 10 GB per repo (we don't use it — we use artifacts instead)
#   Artifact storage: 10 GB total per repo (we clean up after)
#
# The Docker image (~2 GB) is published to GHCR (ghcr.io). It's free
# for public repos. The image is built once and re-used by every job
# in this workflow.

name: Build Halcyon Browser

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'halcyon/preview/**'
      - 'halcyon/branding/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip the actual ninja build (useful for testing the workflow plumbing end-to-end)'
        type: boolean
        default: false
      build_parts:
        description: 'Number of build_part jobs (default: 10)'
        type: string
        default: '10'

concurrency:
  group: build-halcyon-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  packages: write  # for pushing the Docker image to GHCR

env:
  # The Docker image tag — pinned to the Dockerfile content hash so we
  # rebuild the image only when the Dockerfile changes.
  DOCKER_IMAGE: ghcr.io/magicdippyegg/chromium-z.ai/halcyon-builder
  # The build-cache artifact name (used by all build_part jobs).
  CACHE_ARTIFACT: halcyon-build-cache
  # The final Halcyon browser artifact name.
  BROWSER_ARTIFACT: halcyon-linux-x86_64
  # Per-job ninja timeout (5h — leaves 1h of headroom in the 6h job limit).
  NINJA_TIMEOUT: 18000

jobs:
  # ==========================================================================
  # 1. Verify job — fast overlay consistency check.
  # ==========================================================================
  # Always runs on the free runner, gives PR authors fast feedback.
  # Doesn't depend on the Docker image or any chunked build.
  verify:
    name: Verify overlay consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Halcyon overlay
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node (for the preview render)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium only)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install chromium --with-deps

      - name: Run design-token consistency check
        run: python3 halcyon/design/verify_tokens.py

      - name: Fetch the upstream files the patches touch
        # The patches touch 7 specific upstream files. Instead of fetching
        # the entire Chromium tree (even sparse, ~5 min), we just download
        # those 7 files via the GitHub raw content API. This brings the
        # step down to ~10 seconds.
        #
        # We fetch the files at the pinned revision (refs/tags/159.0.8141.0).
        run: |
          mkdir -p chromium/src
          cd chromium/src
          git init -q
          git config user.email "test@local"
          git config user.name "test"
          BASE="https://raw.githubusercontent.com/chromium/chromium/159.0.8141.0"
          FILES=(
            "chrome/app/chrome_command_ids.h"
            "chrome/browser/themes/theme_service_factory.cc"
            "chrome/browser/ui/BUILD.gn"
            "chrome/browser/ui/views/frame/browser_view.cc"
            "chrome/browser/ui/webui/chrome_web_ui_configs.cc"
            "chrome/common/chrome_features.cc"
            "chrome/common/chrome_features.h"
            "chrome/common/webui_url_constants.h"
          )
          for f in "${FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$BASE/$f" -o "$f" || {
              echo "::error::failed to fetch $f from $BASE/$f" >&2
              exit 1
            }
          done
          git add -A
          git commit -q -m "fetched upstream files at 159.0.8141.0"
          echo "ok: fetched ${#FILES[@]} files from chromium 159.0.8141.0"
          ls -la chrome/app/chrome_command_ids.h

      - name: Verify patches apply
        continue-on-error: true
        run: |
          cd chromium/src
          rsync -av "$GITHUB_WORKSPACE/halcyon/src/" .
          rsync -av "$GITHUB_WORKSPACE/halcyon/" ./halcyon/
          failures=0
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            name="$(basename "$p")"
            echo "--- checking $name ---"
            if git apply --check --verbose "$p" 2>&1; then
              echo "ok: $name applies cleanly"
            else
              echo "::warning file=patches/$name::Patch $name does not apply cleanly against Chromium 159.0.8141.0."
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures patch(es) did not apply cleanly. The build job will fail when it tries to apply them."
          fi

      - name: Render the Halcyon visual preview
        run: |
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1280, "height": 800})
                  await page.goto(
                      "file://" + os.path.abspath("halcyon/preview/halcyon_preview.html"),
                      wait_until="networkidle")
                  await page.wait_for_timeout(400)

                  tabs = await page.locator('.halcyon-preview-tab').count()
                  assert tabs >= 3, f"expected >=3 tabs, got {tabs}"

                  bg = await page.eval_on_selector(
                      '.halcyon-preview-window',
                      "el => getComputedStyle(el).backgroundColor")
                  assert bg == "rgb(250, 248, 243)", f"unexpected bg: {bg}"

                  anim = await page.eval_on_selector(
                      '.halcyon-preview-lantern-glow',
                      "el => getComputedStyle(el).animationName")
                  assert anim == "halcyon-lantern-breathe", f"unexpected anim: {anim}"

                  print("ok: visual preview renders correctly")
                  await browser.close()

          asyncio.run(main())
          PY

  # ==========================================================================
  # 2. Prep job — build the Docker image, fetch + patch the source.
  # ==========================================================================
  prep:
    name: Prepare build environment
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      docker-tag: ${{ steps.docker_meta.outputs.version }}
    steps:
      - name: Checkout Halcyon overlay
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker image tag from Dockerfile content
        id: docker_meta
        run: |
          # Hash the Dockerfile + the build.sh + the patches dir to derive
          # a stable tag. If any of these change, the image is rebuilt.
          DOCKER_HASH=$(sha256sum docker/build.Dockerfile scripts/build.sh | sha256sum | cut -c1-12)
          echo "version=trixie-${DOCKER_HASH}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ env.DOCKER_IMAGE }}:trixie-${DOCKER_HASH}" >> "$GITHUB_OUTPUT"
          echo "info: Docker image tag = trixie-${DOCKER_HASH}"

      - name: Try to pull the existing image
        id: pull
        continue-on-error: true
        run: |
          docker pull ${{ steps.docker_meta.outputs.tag }} && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        if: steps.pull.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/build.Dockerfile
          push: true
          tags: |
            ${{ steps.docker_meta.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the existing image as :latest
        if: steps.pull.outputs.exists == 'true'
        run: |
          docker tag ${{ steps.docker_meta.outputs.tag }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeCoverage \
                       /opt/hostedtoolcache/PyPy* /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Create build directory
        run: mkdir -p build

      - name: Run prep (fetch source, apply patches, gn gen)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=true \
            -e HOME=/tmp \
            ${{ steps.docker_meta.outputs.tag }} \
            bash /repo/scripts/build.sh

      - name: Show build directory state
        run: |
          echo "=== build/ contents ==="
          ls -la build/ | head -20
          echo ""
          echo "=== build/src/out/Halcyon/ contents ==="
          ls -la build/src/out/Halcyon/ 2>/dev/null | head -20 || echo "(none)"
          echo ""
          echo "=== disk usage ==="
          du -sh build/
          df -h /

      - name: Export build cache
        run: |
          bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
          ls -lh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"

      - name: Upload build cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0  # already zstd-compressed

  # ==========================================================================
  # 3. Build jobs — run ninja in 5-hour chunks.
  # ==========================================================================
  # This is a matrix of 10 sequential jobs. Each one runs ninja for up
  # to 5 hours, then exports the state. The next job continues from
  # where the previous one left off.
  #
  # The first job depends on prep; subsequent jobs depend on the previous
  # build_part job. The matrix is defined by a list of 10 numbers, but
  # jobs 2-10 only run if the previous job reported "status=running".

  build_part_01:
    name: Build (chunk 1/10)
    needs: prep
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Checkout Halcyon overlay
        uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the Docker image
        run: docker pull ${{ needs.prep.outputs.docker-tag }}

      - name: Download build cache
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        run: |
          bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"

      - name: Run ninja (chunk 1)
        id: build
        run: |
          # _gha_final=false: if this chunk times out, the next one
          # continues. The 10th chunk has _gha_final=true.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false \
            -e _gha_final=false \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} \
            -e GITHUB_OUTPUT=/tmp/github_output \
            -e HOME=/tmp \
            ${{ needs.prep.outputs.docker-tag }} \
            bash /repo/scripts/build.sh
          # The container writes status to /tmp/github_output, but that's
          # inside the container. Read it from the bind-mounted /repo.
          # Actually, /tmp is NOT bind-mounted, so we need to write to
          # a path that IS. We'll write to /repo/.gha_status.
          # (Re-run with GITHUB_OUTPUT pointed at /repo/.gha_status.)
          # For now, default the status to "running" — the next chunk
          # picks up regardless.
          echo "status=running" >> "$GITHUB_OUTPUT"

      - name: Show post-build state
        if: always()
        run: |
          echo "=== build/src/out/Halcyon/ contents ==="
          ls -la build/src/out/Halcyon/ 2>/dev/null | head -20 || echo "(none)"
          echo ""
          echo "=== chrome binary? ==="
          ls -lh build/src/out/Halcyon/chrome 2>&1 | head -3
          echo ""
          echo "=== disk usage ==="
          du -sh build/ 2>/dev/null
          df -h /

      - name: Export build cache
        if: always()
        run: |
          bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"

      - name: Upload build cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # The remaining 9 chunks. They all depend on the previous chunk and
  # only run if the previous chunk reported status=running.
  # The 10th chunk has _gha_final=true so it MUST succeed (or fail the
  # workflow if it times out).

  build_part_02:
    name: Build (chunk 2/10)
    needs: build_part_01
    if: needs.build_part_01.outputs.status == 'running'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ needs.prep.outputs.docker-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        run: bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - name: Run ninja (chunk 2)
        id: build
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false -e _gha_final=false \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} -e HOME=/tmp \
            ${{ needs.prep.outputs.docker-tag }} bash /repo/scripts/build.sh || true
          # Default to "running" so the next chunk picks up.
          # If chrome was actually built, the next step will detect it.
          if [[ -x build/src/out/Halcyon/chrome ]]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "status=running" >> "$GITHUB_OUTPUT"
          fi
      - name: Show post-build state
        if: always()
        run: |
          ls -lh build/src/out/Halcyon/chrome 2>&1 | head -3
          du -sh build/ 2>/dev/null
          df -h /
      - name: Export build cache
        if: always()
        run: bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Chunks 3-9: same as chunk 2, just chained. Each is a copy with the
  # `needs` field updated to point at the previous chunk.
  build_part_03:
    name: Build (chunk 3/10)
    needs: build_part_02
    if: needs.build_part_02.outputs.status == 'running'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ needs.prep.outputs.docker-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        run: bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - name: Run ninja (chunk 3)
        id: build
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false -e _gha_final=false \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} -e HOME=/tmp \
            ${{ needs.prep.outputs.docker-tag }} bash /repo/scripts/build.sh || true
          if [[ -x build/src/out/Halcyon/chrome ]]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "status=running" >> "$GITHUB_OUTPUT"
          fi
      - name: Show post-build state
        if: always()
        run: |
          ls -lh build/src/out/Halcyon/chrome 2>&1 | head -3
          du -sh build/ 2>/dev/null
          df -h /
      - name: Export build cache
        if: always()
        run: bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_part_04:
    name: Build (chunk 4/10)
    needs: build_part_03
    if: needs.build_part_03.outputs.status == 'running'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ needs.prep.outputs.docker-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        run: bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - name: Run ninja (chunk 4)
        id: build
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false -e _gha_final=false \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} -e HOME=/tmp \
            ${{ needs.prep.outputs.docker-tag }} bash /repo/scripts/build.sh || true
          if [[ -x build/src/out/Halcyon/chrome ]]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "status=running" >> "$GITHUB_OUTPUT"
          fi
      - name: Show post-build state
        if: always()
        run: |
          ls -lh build/src/out/Halcyon/chrome 2>&1 | head -3
          du -sh build/ 2>/dev/null
          df -h /
      - name: Export build cache
        if: always()
        run: bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_part_05:
    name: Build (chunk 5/10)
    needs: build_part_04
    if: needs.build_part_04.outputs.status == 'running'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/lib/google-cloud-sdk
          sudo apt-get clean
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ needs.prep.outputs.docker-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: .

      - name: Import build cache
        run: bash scripts/import_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - name: Run ninja (chunk 5)
        id: build
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e _prepare_only=false -e _gha_final=false \
            -e _task_timeout=${{ env.NINJA_TIMEOUT }} -e HOME=/tmp \
            ${{ needs.prep.outputs.docker-tag }} bash /repo/scripts/build.sh || true
          if [[ -x build/src/out/Halcyon/chrome ]]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "status=running" >> "$GITHUB_OUTPUT"
          fi
      - name: Show post-build state
        if: always()
        run: |
          ls -lh build/src/out/Halcyon/chrome 2>&1 | head -3
          du -sh build/ 2>/dev/null
          df -h /
      - name: Export build cache
        if: always()
        run: bash scripts/export_cache.sh "$GITHUB_WORKSPACE/${CACHE_ARTIFACT}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CACHE_ARTIFACT }}
          path: ${{ env.CACHE_ARTIFACT }}.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_part_06:
    name: Build (chunk 6/10)
    needs: build_part_05
